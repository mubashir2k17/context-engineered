# Build and deploy the Hugo site to GitHub Pages.
# Blowfish requires Hugo Extended (Sass/SCSS). Official Hugo Pages docs:
# https://gohugo.io/host-and-deploy/host-on-github-pages/
#
# GitHub Pages → Settings → Pages → Source must be "GitHub Actions".
# Leaving Source on "Deploy from a branch" also runs GitHub's Jekyll
# pages-build-deployment workflow, which fails for this Hugo repo.
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.102.0
      HUGO_VERSION: 0.165.0
      TZ: Asia/Karachi
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: mkdir -p "${HOME}/.local"

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo Extended
        run: |
          echo "Installing Hugo Extended ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Hugo: $(hugo version)"

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-${{ github.run_id }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-
            hugo-${{ runner.os }}-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_CACHEDIR: ${{ runner.temp }}/.cache/hugo
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url || 'https://context-engineered.com' }}
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${HUGO_BASEURL}/" \
            --cacheDir "${HUGO_CACHEDIR}" \
            --printPathWarnings

      - name: Verify build output
        run: |
          test -f public/index.html
          test -f public/CNAME
          grep -q "context-engineered.com" public/CNAME
          test -d public/posts
          test -d public/about
          test -d public/authors/mubashir-ali

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
