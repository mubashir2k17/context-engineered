<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-labelledby="title desc">
  <title id="title">Single-shot LLM call versus an agentic loop</title>
  <desc id="desc">Left: a linear chatbot flow of prompt then answer. Right: an agentic loop that reasons, acts, observes, and repeats until a goal is met.</desc>
  <rect width="860" height="500" rx="24" fill="#07111f"/>
  <text x="430" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">You stay in the loop, or the loop runs itself</text>
  <rect x="32" y="68" width="380" height="392" rx="18" fill="#0d1828" stroke="#1e293b"/>
  <text x="222" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">SINGLE-SHOT CHAT</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="78" y="128" width="288" height="48" rx="12" fill="#122036" stroke="#334155"/>
    <text x="222" y="158" text-anchor="middle" font-size="14" fill="#e2e8f0">You write a prompt</text>
    <text x="222" y="196" text-anchor="middle" font-size="18" fill="#64748b">v</text>
    <rect x="78" y="214" width="288" height="48" rx="12" fill="#122036" stroke="#334155"/>
    <text x="222" y="244" text-anchor="middle" font-size="14" fill="#e2e8f0">Model generates once</text>
    <text x="222" y="282" text-anchor="middle" font-size="18" fill="#64748b">v</text>
    <rect x="78" y="300" width="288" height="48" rx="12" fill="#122036" stroke="#334155"/>
    <text x="222" y="330" text-anchor="middle" font-size="14" fill="#e2e8f0">You check and re-prompt</text>
    <text x="222" y="384" text-anchor="middle" font-size="13" fill="#64748b">Human closes every feedback gap</text>
  </g>
  <rect x="448" y="68" width="380" height="392" rx="18" fill="#0d1828" stroke="#2dd4bf" stroke-opacity="0.45"/>
  <text x="638" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2dd4bf">AGENTIC LOOP</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="494" y="128" width="288" height="48" rx="12" fill="#0f2a28" stroke="#2dd4bf"/>
    <text x="638" y="158" text-anchor="middle" font-size="14" fill="#e2e8f0">You set a checkable goal</text>
    <text x="638" y="196" text-anchor="middle" font-size="18" fill="#2dd4bf">v</text>
    <rect x="494" y="214" width="288" height="48" rx="12" fill="#122036" stroke="#60a5fa"/>
    <text x="638" y="244" text-anchor="middle" font-size="14" fill="#e2e8f0">Agent reasons, acts, observes</text>
    <text x="638" y="282" text-anchor="middle" font-size="18" fill="#f5c16c">loop</text>
    <rect x="494" y="300" width="288" height="48" rx="12" fill="#2a2110" stroke="#f5c16c"/>
    <text x="638" y="330" text-anchor="middle" font-size="14" fill="#e2e8f0">Verifier decides: done or retry</text>
    <text x="638" y="384" text-anchor="middle" font-size="13" fill="#94a3b8">The loop closes the feedback gap</text>
  </g>
</svg>
