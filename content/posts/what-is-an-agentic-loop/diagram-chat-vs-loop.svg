<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Single-shot chat versus an agentic loop</title>
  <desc id="desc">Left: a person re-prompts after every answer. Right: the agent iterates against a verifier until a goal is met.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#1C1915"/>
    </marker>
    <marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#3A5344"/>
    </marker>
    <marker id="arrow-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#6B6458"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="8" fill="#F2EBE0" stroke="#C4BAAE" stroke-width="1"/>
  <text x="480" y="44" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="22" fill="#1C1915">Who closes the feedback gap?</text>
  <rect x="36" y="68" width="430" height="380" rx="6" fill="#FBF7F0" stroke="#C4BAAE"/>
  <text x="251.0" y="102" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6B6458">YOU ARE THE LOOP</text>
  <text x="251.0" y="128" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="20" fill="#1C1915">Single-shot chat</text>
  <rect x="72" y="168" width="358" height="44" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="251.0" y="196" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1C1915">You write a prompt</text>
  <path d="M 251.0 216 V 234" fill="none" stroke="#1C1915" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="72" y="238" width="358" height="44" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="251.0" y="266" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1C1915">The model answers once</text>
  <path d="M 251.0 286 V 304" fill="none" stroke="#1C1915" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="72" y="308" width="358" height="44" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="251.0" y="336" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1C1915">You check and re-prompt</text>
  <text x="251.0" y="424" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6458">A human closes every gap.</text>
  <rect x="494" y="68" width="430" height="380" rx="6" fill="#FBF7F0" stroke="#C4BAAE"/>
  <rect x="504" y="84" width="4" height="348" rx="2" fill="#3A5344"/>
  <text x="709.0" y="102" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6B6458">THE LOOP RUNS ITSELF</text>
  <text x="709.0" y="128" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="20" fill="#1C1915">Agentic loop</text>
  <rect x="530" y="168" width="358" height="44" rx="4" fill="#E7DDD0" stroke="#C4BAAE"/>
  <text x="709.0" y="196" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1C1915">You set a checkable goal</text>
  <path d="M 709.0 216 V 234" fill="none" stroke="#1C1915" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="530" y="238" width="358" height="44" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="709.0" y="266" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1C1915">Agent reasons, acts, observes</text>
  <path d="M 709.0 286 V 304" fill="none" stroke="#1C1915" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="530" y="308" width="358" height="44" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="709.0" y="336" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1C1915">Verifier: done, or retry</text>
  <text x="709.0" y="424" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3A5344">The loop closes the gap.</text>
</svg>
