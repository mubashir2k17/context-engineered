<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Single-shot chat versus an agentic loop</title>
  <desc id="desc">Left: a person re-prompts after every answer. Right: the agent iterates against a verifier until a goal is met.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.4 L 10 5 L 0 8.6 Z" fill="#1A1714"/>
    </marker>
    <marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.4 L 10 5 L 0 8.6 Z" fill="#3D4F40"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="4" fill="#EFE6D8" stroke="#C8BFAF" stroke-width="1"/>
  <text x="480" y="40" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="23" fill="#1A1714">Who closes the feedback gap?</text>
  <rect x="32" y="64" width="428" height="412" rx="3" fill="#F8F3EA" stroke="#C8BFAF" stroke-width="1"/>
  <text x="246.0" y="98" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5C564E" letter-spacing="1.8">YOU ARE THE LOOP</text>
  <text x="246.0" y="128" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="21" fill="#1A1714">Single-shot chat</text>
  <rect x="68" y="164" width="356" height="48" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="246.0" y="195" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1714">You write a prompt</text>
  <path d="M 246.0 218 V 236" fill="none" stroke="#1A1714" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="68" y="240" width="356" height="48" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="246.0" y="271" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1714">The model answers once</text>
  <path d="M 246.0 294 V 312" fill="none" stroke="#1A1714" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="68" y="316" width="356" height="48" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="246.0" y="347" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1714">You check and re-prompt</text>
  <text x="246.0" y="452" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5C564E">A human closes every gap.</text>
  <rect x="500" y="64" width="428" height="412" rx="3" fill="#F8F3EA" stroke="#C8BFAF" stroke-width="1"/>
  <rect x="510" y="80" width="4" height="380" rx="2" fill="#3D4F40"/>
  <text x="714.0" y="98" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5C564E" letter-spacing="1.8">THE LOOP RUNS ITSELF</text>
  <text x="714.0" y="128" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="21" fill="#1A1714">Agentic loop</text>
  <rect x="536" y="164" width="356" height="48" rx="3" fill="#E4D8C6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="714.0" y="195" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1714">You set a checkable goal</text>
  <path d="M 714.0 218 V 236" fill="none" stroke="#1A1714" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="536" y="240" width="356" height="48" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="714.0" y="271" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1714">Agent reasons, acts, observes</text>
  <path d="M 714.0 294 V 312" fill="none" stroke="#1A1714" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="536" y="316" width="356" height="48" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="714.0" y="347" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1714">Verifier: done, or retry</text>
  <text x="714.0" y="452" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#3D4F40">The loop closes the gap.</text>
</svg>
