<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Five iterations of an agentic loop fixing a money parser</title>
  <desc id="desc">A timeline of five loop iterations: reproduce the failing tests, implement a naive parser, fail on European formats, add currency and empty-string handling, then pass an independent grader.</desc>
  <rect width="900" height="560" rx="24" fill="#07111f"/>
  <text x="450" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Worked example: five loops to a passing parser</text>
  <text x="450" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Goal: parse_money() returns Decimal for every fixture. Tests are read-only.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- iteration 1 -->
    <rect x="28" y="92" width="844" height="76" rx="14" fill="#0d1828" stroke="#334155"/>
    <circle cx="64" cy="130" r="18" fill="#1e3a5f"/>
    <text x="64" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#60a5fa">1</text>
    <text x="100" y="118" font-size="14" font-weight="700" fill="#f8fafc">Gather  read billing/parse.py and tests/test_parse_money.py</text>
    <text x="100" y="142" font-size="13" fill="#94a3b8">Observation: 6 failed, 2 passed. Empty string and $12.00 already work. ¬1.234,56 and 1,234.56 USD do not.</text>
    <!-- 2 -->
    <rect x="28" y="180" width="844" height="76" rx="14" fill="#0d1828" stroke="#334155"/>
    <circle cx="64" cy="218" r="18" fill="#134e4a"/>
    <text x="64" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">2</text>
    <text x="100" y="206" font-size="14" font-weight="700" fill="#f8fafc">Act  strip $ and call Decimal(s)</text>
    <text x="100" y="230" font-size="13" fill="#94a3b8">Verify: still 4 failed. Decimal() cannot parse thousand separators or a trailing currency code.</text>
    <!-- 3 -->
    <rect x="28" y="268" width="844" height="76" rx="14" fill="#0d1828" stroke="#334155"/>
    <circle cx="64" cy="306" r="18" fill="#4a3514"/>
    <text x="64" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#f5c16c">3</text>
    <text x="100" y="294" font-size="14" font-weight="700" fill="#f8fafc">Act  detect EU vs US separators from the last comma or dot</text>
    <text x="100" y="318" font-size="13" fill="#94a3b8">Verify: 1 failed.  (em dash for missing amount) still raises InvalidOperation.</text>
    <!-- 4 -->
    <rect x="28" y="356" width="844" height="76" rx="14" fill="#0d1828" stroke="#334155"/>
    <circle cx="64" cy="394" r="18" fill="#4a1d4a"/>
    <text x="64" y="399" text-anchor="middle" font-size="13" font-weight="700" fill="#e879f9">4</text>
    <text x="100" y="382" font-size="14" font-weight="700" fill="#f8fafc">Act  treat blank / dash / n/a as None; keep Decimal for real amounts</text>
    <text x="100" y="406" font-size="13" fill="#94a3b8">Verify: pytest 8 passed, 0 failed. Typecheck and linter clean.</text>
    <!-- 5 -->
    <rect x="28" y="444" width="844" height="84" rx="14" fill="#102033" stroke="#2dd4bf"/>
    <circle cx="64" cy="486" r="18" fill="#134e4a"/>
    <text x="64" y="491" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">5</text>
    <text x="100" y="474" font-size="14" font-weight="700" fill="#f8fafc">Independent grader  fresh subagent, read-only, asked what is wrong?</text>
    <text x="100" y="498" font-size="13" fill="#94a3b8">Finding: locale detection used rfind('.') which misreads 1234. Fix: require a grouping pattern, not just the last separator. Tests still pass.</text>
  </g>
</svg>
