<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc">
  <title id="title">The agentic loop: gather, act, verify, repeat</title>
  <desc id="desc">Three stages in a row: Gather, Act, Verify. A return path labeled Repeat closes the cycle until a stop condition.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#1C1915"/>
    </marker>
    <marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#3A5344"/>
    </marker>
    <marker id="arrow-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#6B6458"/>
    </marker>
  </defs>
  <rect width="960" height="460" rx="8" fill="#F2EBE0" stroke="#C4BAAE" stroke-width="1"/>
  <text x="480" y="46" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="22" fill="#1C1915">The agentic loop</text>
  <text x="480" y="72" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6458">Gather, act, verify. Repeat until a checkable stop.</text>
  <rect x="40" y="100" width="280" height="148" rx="6" fill="#FBF7F0" stroke="#C4BAAE"/>
  <text x="62" y="136" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6" fill="#6B6458">01</text>
  <text x="62" y="168" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="22" fill="#1C1915">Gather</text>
  <text x="62" y="198" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B6458">Read files, search the repo,</text>
  <text x="62" y="218" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B6458">inspect the current state.</text>
  <path d="M 326 174.0 H 334" fill="none" stroke="#1C1915" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="340" y="100" width="280" height="148" rx="6" fill="#FBF7F0" stroke="#C4BAAE"/>
  <text x="362" y="136" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6" fill="#6B6458">02</text>
  <text x="362" y="168" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="22" fill="#1C1915">Act</text>
  <text x="362" y="198" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B6458">Edit code, run tools,</text>
  <text x="362" y="218" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B6458">call APIs, write patches.</text>
  <path d="M 626 174.0 H 634" fill="none" stroke="#1C1915" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="640" y="100" width="280" height="148" rx="6" fill="#FBF7F0" stroke="#C4BAAE"/>
  <text x="662" y="136" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6" fill="#6B6458">03</text>
  <text x="662" y="168" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="22" fill="#1C1915">Verify</text>
  <text x="662" y="198" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B6458">Tests, linters, typechecks,</text>
  <text x="662" y="218" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B6458">or an independent grader.</text>
  <path d="M 780.0 268 V 312 H 180.0 V 268" fill="none" stroke="#3A5344" stroke-width="1.4" marker-end="url(#arrow-forest)"/>
  <rect x="390" y="296" width="180" height="32" rx="16" fill="#F2EBE0" stroke="#3A5344" stroke-width="1.2"/>
  <text x="480" y="317" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.8" fill="#3A5344">REPEAT</text>
  <text x="480" y="430" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6458">The loop, not the model, is the unit of agentic coding.</text>
</svg>
