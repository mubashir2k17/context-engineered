<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
  <title id="title">The agentic loop: gather context, take action, verify work, then repeat</title>
  <desc id="desc">A circular diagram of an AI agentic loop. Three stages sit on a ring: Gather Context, Take Action, and Verify Work. Repeat sits in the center. The loop continues until a checkable stop condition is met.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0c1b2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#f5c16c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="840" height="560" rx="24" fill="url(#bg)"/>
  <circle cx="420" cy="292" r="168" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.35"/>
  <circle cx="420" cy="292" r="128" fill="none" stroke="#1e3a4c" stroke-width="1.5" stroke-dasharray="5 8"/>
  <!-- arrows around the ring -->
  <path d="M 292 196 A 168 168 0 0 1 548 196" fill="none" stroke="url(#ring)" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M 568 228 A 168 168 0 0 1 512 430" fill="none" stroke="url(#ring)" stroke-width="2.5"/>
  <path d="M 478 448 A 168 168 0 0 1 272 228" fill="none" stroke="url(#ring)" stroke-width="2.5"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <!-- center -->
  <circle cx="420" cy="292" r="62" fill="#0a1626" stroke="#2dd4bf" stroke-width="2" filter="url(#glow)"/>
  <text x="420" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">REPEAT</text>
  <text x="420" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">until a stop condition</text>
  <!-- node 1 gather -->
  <g transform="translate(420,78)">
    <rect x="-118" y="-42" width="236" height="84" rx="16" fill="#102033" stroke="#2dd4bf" stroke-width="1.6"/>
    <circle cx="-88" cy="0" r="16" fill="#134e4a"/>
    <text x="-88" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, sans-serif">1</text>
    <text x="12" y="-8" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif">Gather context</text>
    <text x="12" y="16" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif">Read files, search, inspect state</text>
  </g>
  <!-- node 2 act -->
  <g transform="translate(668,390)">
    <rect x="-118" y="-42" width="236" height="84" rx="16" fill="#102033" stroke="#60a5fa" stroke-width="1.6"/>
    <circle cx="-88" cy="0" r="16" fill="#1e3a5f"/>
    <text x="-88" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#60a5fa" font-family="ui-sans-serif, system-ui, sans-serif">2</text>
    <text x="12" y="-8" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif">Take action</text>
    <text x="12" y="16" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif">Edit code, run tools, call APIs</text>
  </g>
  <!-- node 3 verify -->
  <g transform="translate(172,390)">
    <rect x="-118" y="-42" width="236" height="84" rx="16" fill="#102033" stroke="#f5c16c" stroke-width="1.6"/>
    <circle cx="-88" cy="0" r="16" fill="#4a3514"/>
    <text x="-88" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#f5c16c" font-family="ui-sans-serif, system-ui, sans-serif">3</text>
    <text x="12" y="-8" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif">Verify work</text>
    <text x="12" y="16" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif">Tests, linters, independent checks</text>
  </g>
  <text x="420" y="536" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">The loop, not the model, is the unit of agentic coding.</text>
</svg>
