<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">Layered termination for an agentic loop</title>
  <desc id="desc">Four nested stop conditions: a done-check at the center, then no-progress detection, a step cap, and an outer cost or wall-clock budget. Any layer can halt the loop.</desc>
  <rect width="860" height="430" rx="24" fill="#07111f"/>
  <text x="430" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Layered termination: any layer can halt the loop</text>
  <rect x="70" y="70" width="720" height="300" rx="22" fill="#1a1420" stroke="#fb7185" stroke-width="2"/>
  <text x="92" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fb7185">4  COST / TIME BUDGET</text>
  <text x="430" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">e.g. $8 or 25 minutes - the last backstop</text>
  <rect x="100" y="116" width="660" height="232" rx="18" fill="#1a1810" stroke="#f5c16c" stroke-width="2"/>
  <text x="122" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f5c16c">3  STEP CAP</text>
  <text x="430" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">e.g. 20 turns for a scoped bugfix</text>
  <rect x="130" y="164" width="600" height="162" rx="16" fill="#101a28" stroke="#60a5fa" stroke-width="2"/>
  <text x="152" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">2  NO-PROGRESS DETECTOR</text>
  <text x="430" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">same failing test, same diff, two rounds - stop</text>
  <rect x="170" y="214" width="520" height="90" rx="14" fill="#0f241f" stroke="#2dd4bf" stroke-width="2"/>
  <text x="430" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2dd4bf">1  DONE-CHECK</text>
  <text x="430" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">pytest exits 0 | tests untouched | only in-scope files changed</text>
  <text x="430" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">A loop with only a done-check can grind forever. A loop with only a cap stops too early or too late.</text>
</svg>
