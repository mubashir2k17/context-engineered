<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Maker-grader separation in an agentic loop</title>
  <desc id="desc">The maker writes code. An independent grader in a fresh context checks it. Arrows carry a diff one way and findings back.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.4 L 10 5 L 0 8.6 Z" fill="#1A1714"/>
    </marker>
    <marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.4 L 10 5 L 0 8.6 Z" fill="#3D4F40"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="4" fill="#EFE6D8" stroke="#C8BFAF" stroke-width="1"/>
  <text x="480" y="40" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="22" fill="#1A1714">Never let the maker grade its own homework</text>
  <rect x="32" y="68" width="380" height="348" rx="3" fill="#F8F3EA" stroke="#C8BFAF" stroke-width="1"/>
  <text x="222.0" y="100" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5C564E" letter-spacing="1.6">WRITES THE CHANGE</text>
  <text x="222.0" y="132" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="24" fill="#1A1714">Maker</text>
  <rect x="56" y="164" width="332" height="44" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="222.0" y="192" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1714">Implement the patch</text>
  <rect x="56" y="220" width="332" height="44" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="222.0" y="248" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1714">Hand off a diff and evidence</text>
  <rect x="56" y="276" width="332" height="44" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="222.0" y="304" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1714">Does not decide done</text>
  <text x="222.0" y="392" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C564E">Same context that produced the bug</text>
  <rect x="548" y="68" width="380" height="348" rx="3" fill="#F8F3EA" stroke="#C8BFAF" stroke-width="1"/>
  <text x="738.0" y="100" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5C564E" letter-spacing="1.6">CHECKS THE CHANGE</text>
  <text x="738.0" y="132" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="24" fill="#1A1714">Grader</text>
  <rect x="572" y="164" width="332" height="44" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="738.0" y="192" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1714">Run tests, lint, or a rubric</text>
  <rect x="572" y="220" width="332" height="44" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="738.0" y="248" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1714">Ask what is wrong</text>
  <rect x="572" y="276" width="332" height="44" rx="3" fill="#FFFCF6" stroke="#C8BFAF" stroke-width="1"/>
  <text x="738.0" y="304" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1714">Pass only with evidence</text>
  <text x="738.0" y="392" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5C564E">Cannot excuse a bug it did not write</text>
  <path d="M 420 196 H 540" fill="none" stroke="#1A1714" stroke-width="1.35" marker-end="url(#arrow)"/>
  <rect x="454" y="168" width="52" height="22" rx="11" fill="#EFE6D8" stroke="#C8BFAF" stroke-width="1"/>
  <text x="480" y="184" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5C564E" letter-spacing="1.4">DIFF</text>
  <path d="M 540 300 H 420" fill="none" stroke="#3D4F40" stroke-width="1.35" marker-end="url(#arrow-forest)"/>
  <rect x="436" y="272" width="88" height="22" rx="11" fill="#EFE6D8" stroke="#3D4F40" stroke-width="1"/>
  <text x="480" y="288" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#3D4F40" letter-spacing="1.1">FINDINGS</text>
  <rect x="32" y="436" width="896" height="52" rx="3" fill="#E4D8C6"/>
  <text x="480" y="468" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1714">Best grader: a script. Next: a separate model. Worst: the same chat.</text>
</svg>
