<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="title desc">
  <title id="title">Maker-grader separation in an agentic loop</title>
  <desc id="desc">The maker writes code. An independent grader in a fresh context checks it. Arrows carry a diff one way and findings back.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#1C1915"/>
    </marker>
    <marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#3A5344"/>
    </marker>
    <marker id="arrow-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#6B6458"/>
    </marker>
  </defs>
  <rect width="960" height="484" rx="8" fill="#F2EBE0" stroke="#C4BAAE" stroke-width="1"/>
  <text x="480" y="44" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="22" fill="#1C1915">Never let the maker grade its own homework</text>
  <rect x="36" y="72" width="390" height="320" rx="6" fill="#FBF7F0" stroke="#C4BAAE"/>
  <text x="231.0" y="104" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6B6458">WRITES THE CHANGE</text>
  <text x="231.0" y="132" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="22" fill="#1C1915">Maker</text>
  <rect x="64" y="160" width="334" height="40" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="231.0" y="186" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1C1915">Implement the patch</text>
  <rect x="64" y="212" width="334" height="40" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="231.0" y="238" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1C1915">Hand off a diff and evidence</text>
  <rect x="64" y="264" width="334" height="40" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="231.0" y="290" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1C1915">Does not decide done</text>
  <text x="231.0" y="368" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6458">Same context that produced the bug</text>
  <rect x="534" y="72" width="390" height="320" rx="6" fill="#FBF7F0" stroke="#C4BAAE"/>
  <text x="729.0" y="104" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6B6458">CHECKS THE CHANGE</text>
  <text x="729.0" y="132" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="22" fill="#1C1915">Grader</text>
  <rect x="562" y="160" width="334" height="40" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="729.0" y="186" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1C1915">Run tests, lint, or a rubric</text>
  <rect x="562" y="212" width="334" height="40" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="729.0" y="238" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1C1915">Ask what is wrong</text>
  <rect x="562" y="264" width="334" height="40" rx="4" fill="#FFFcf7" stroke="#C4BAAE"/>
  <text x="729.0" y="290" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1C1915">Pass only with evidence</text>
  <text x="729.0" y="368" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6458">Cannot excuse a bug it did not write</text>
  <path d="M 430 190 H 528" fill="none" stroke="#1C1915" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="480" y="178" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.2" fill="#6B6458">DIFF</text>
  <path d="M 528 278 H 430" fill="none" stroke="#3A5344" stroke-width="1.4" marker-end="url(#arrow-forest)"/>
  <text x="480" y="266" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.2" fill="#3A5344">FINDINGS</text>
  <rect x="36" y="412" width="888" height="48" rx="6" fill="#E7DDD0"/>
  <text x="480" y="442" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1C1915">Best grader: a script. Next: a separate model. Worst: the same chat.</text>
</svg>
